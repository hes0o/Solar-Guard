<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolarGuard — Login</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main style="max-width:380px;margin-top:12vh">
  <div style="font-weight:700;font-size:22px;color:var(--sun);margin-bottom:6px">☀ SolarGuard</div>
  <p class="muted" style="margin-top:0">Solar panel soiling monitoring</p>
  <form class="card" id="f">
    <label class="muted" for="user">Role</label>
    <select id="user" name="user" style="width:100%;margin:6px 0 14px">
      <option value="manager">Manager</option>
      <option value="staff">Cleaning staff</option>
    </select>
    <label class="muted" for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required
           style="width:100%;margin:6px 0 16px">
    <button class="primary" style="width:100%">Log in</button>
    <p id="err" role="alert" style="color:var(--bad);margin:12px 0 0;min-height:1em"></p>
  </form>
</main>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { err.textContent = body.detail || "Login failed"; return; }
  const next = new URLSearchParams(location.search).get("next");
  // Only same-site paths, so a crafted link can't bounce users to another site.
  location.href = next && next.startsWith("/") && !next.startsWith("//") ? next : body.home;
};
</script>
</body>
</html>
